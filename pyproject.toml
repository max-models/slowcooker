[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "slowcooker"
version = "0.1.0"
description = "1.5D core transport for tokamaks and stellarators: TORAX with GVEC geometry and freeofcharge NBI."
readme = "README.md"
keywords = [ "fusion", "gvec", "neutral beam injection", "plasma", "stellarator", "tokamak", "torax", "transport" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max Lindqvist" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# PyPI rejects direct references (name @ git+...), so only version ranges go here; the
# max-models packages come from their devel branches through [tool.uv.sources]
dependencies = [
  "freeofcharge",
  "numpy",
  "scope-profiler>=0.7.5",
  "torax==2.0.0",
  "xarray",
]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "slowcooker[docs,gvec,test]",
]
optional-dependencies.docs = [
  "freeofcharge[gvec]",
  "griffe",
  "ipykernel",
  "kaleido",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
  "plasma-plots[web]>=0.2.5",
]
optional-dependencies.gvec = [ "freeofcharge[gvec]" ]
optional-dependencies.test = [ "pytest", "pytest-cov" ]
urls.Source = "https://github.com/max-models/slowcooker"
scripts.slowcooker = "slowcooker.main:main"

[tool.setuptools]
package-data."*" = [ "data/*.dat", "data/*.ini", "py.typed" ]
packages.find.where = [ "src" ]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "slowcooker" ]
report.show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
# one entry per max-models package in [project], spelled exactly like this in every repo:
# transitive max-models packages too, so freeofcharge's devel gets their devel branches
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
freeofcharge = { git = "https://github.com/max-models/freeofcharge", branch = "claude/astra-plasma-physics-72n2n2" }
maybempi = { git = "https://github.com/max-models/maybempi", branch = "devel" }
methodcard = { git = "https://github.com/max-models/methodcard", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
plasmacoll = { git = "https://github.com/max-models/plasmacoll", branch = "devel" }
simgeometry = { git = "https://github.com/max-models/simgeometry", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
