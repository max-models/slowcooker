name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0
    with:
      # GVEC is built from source: a Fortran compiler and netCDF-Fortran
      apt-packages: gfortran cmake pkg-config liblapack-dev libnetcdff-dev
      extras: docs gvec
      pre-build: uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        examples/index.html
        examples/gvec-geometry/index.html
        examples/nbi-heating/index.html
        examples/tokamak-nbi/index.html
        example-scripts/index.html
        example-scripts/w7x-coupled/index.html
        api/slowcooker/index.html
        api/slowcooker/geometry/index.html
        examples/gvec-geometry/gvec_geometry.ipynb
        example-scripts/w7x-coupled/plot-1.plotly.json
        example-scripts/w7x-coupled/plot-1.png
